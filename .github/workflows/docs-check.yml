name: Research verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository documents
        run: python scripts/check_docs.py
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run preregistered EXP-0001 suite
        run: python -m packages.cli --suite --output .run/EXP-0001-result.json
      - name: Run preregistered EXP-0002 comparison
        run: python -m packages.evaluation --output .run/EXP-0002-result.json
      - name: EXP-0002B preregistered split manifest (hash only; no FINAL search)
        run: python -m packages.kernel --mode preflight --output .run/EXP-0002B-preflight.json
      - name: EXP-0002B TRAIN-only snapshot (no DEV/FINAL search)
        run: python -m packages.kernel --mode train --output .run/EXP-0002B-train-only.json
      - name: EXP-0002B DEV engineering smoke (main push only; never PR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m packages.kernel.eval_cli --phase dev --output .run/EXP-0002B-DEV-smoke.json
      - name: Upload EXP-0002B DEV smoke (not FINAL)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002B-DEV-smoke
          path: .run/EXP-0002B-DEV-smoke.json
          if-no-files-found: warn
      # Exactly the reviewed, approved squash-merge main push can activate FINAL.
      # pull_request, routine main pushes, and workflow re-runs cannot start it.
      - name: EXP-0002B FINAL112 one-shot evaluation (reviewed main activation only)
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.run_attempt == 1 &&
          startsWith(github.event.head_commit.message, 'EXP-0002B FINAL112 activation [20261025-APPROVED]')
        run: python -m packages.kernel.eval_cli --phase final --output .run/EXP-0002B-FINAL112.json
      - name: Upload EXP-0002B FINAL112 evidence (reviewed main activation only)
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.run_attempt == 1 &&
          startsWith(github.event.head_commit.message, 'EXP-0002B FINAL112 activation [20261025-APPROVED]')
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002B-FINAL112
          path: .run/EXP-0002B-FINAL112.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload EXP-0002B TRAIN-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002B-train-only
          path: |
            .run/EXP-0002B-preflight.json
            .run/EXP-0002B-train-only.json
          if-no-files-found: warn
      - name: Upload EXP-0002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002-result
          path: .run/EXP-0002-result.json
          if-no-files-found: warn
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0001-result
          path: .run/EXP-0001-result.json
          if-no-files-found: warn
