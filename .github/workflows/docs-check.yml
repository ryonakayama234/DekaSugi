name: Research verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository documents
        run: python scripts/check_docs.py
      - name: METRO-0001 CAL-01 fixed synthetic fixture calibration (no EXP holdouts)
        run: |
          mkdir -p .run
          python -m packages.metrology --mode calibrate --output .run/METRO-0001-CAL-01.json --fixtures-output .run/METRO-0001-CAL-01.fixtures.json
      - name: Upload METRO-0001 CAL-01 synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: METRO-0001-CAL-01
          path: |
            .run/METRO-0001-CAL-01.json
            .run/METRO-0001-CAL-01.fixtures.json
          if-no-files-found: error
      - name: EXP-0003A PR4 generate hash-only candidate BEFORE tests (no holdout evaluation)
        run: python -m packages.exp0003a.freeze_cli --mode preflight --output .run/EXP-0003A-PR4-preflight.json
      - name: OPPORTUNITY-001 PILOT-V1 public TRAIN64 manifest SHA only (no trial scoring)
        run: python -m packages.evaluation.opportunity_pilot --mode hash-only
      - name: OPPORTUNITY-001 independent TRAIN64 public/audit commitments hash-only
        run: python scripts/audit_opportunity_pilot_public.py
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run preregistered EXP-0001 suite
        run: python -m packages.cli --suite --output .run/EXP-0001-result.json
      - name: Run preregistered EXP-0002 comparison
        run: python -m packages.evaluation --output .run/EXP-0002-result.json
      - name: EXP-0003A TRAIN-only Wake-Sleep engineering evidence (never DEV/FINAL/DREAM)
        run: python -m packages.exp0003a --mode train --output .run/EXP-0003A-TRAIN-engineering.json
      - name: Upload EXP-0003A TRAIN-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0003A-TRAIN-engineering
          path: |
            .run/EXP-0003A-TRAIN-engineering.json
            .run/EXP-0003A-TRAIN-engineering.episodes.jsonl
            .run/EXP-0003A-TRAIN-engineering.evaluator-private.json
          if-no-files-found: warn
      - name: EXP-0003A PR3 TRAIN/DREAM engineering only (never EXP-0003A DEV/FINAL)
        run: python -m packages.exp0003a.pr3_cli --mode train-dream --output .run/EXP-0003A-PR3-TRAIN-DREAM.json
      - name: Upload EXP-0003A PR3 TRAIN/DREAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0003A-PR3-TRAIN-DREAM
          path: |
            .run/EXP-0003A-PR3-TRAIN-DREAM.json
            .run/EXP-0003A-PR3-TRAIN-DREAM.evaluator-private.json
          if-no-files-found: warn
      - name: EXP-0003A PR4 strict freeze verification (no DEV/FINAL scoring)
        run: python -m packages.exp0003a.freeze_cli --mode check-freeze --output .run/EXP-0003A-PR4-freeze-check.json
      - name: Upload EXP-0003A PR4 hash-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0003A-PR4-freeze-preflight
          path: |
            .run/EXP-0003A-PR4-preflight.json
            .run/EXP-0003A-PR4-freeze-check.json
          if-no-files-found: warn
      - name: EXP-0002B preregistered split manifest (hash only; no FINAL search)
        run: python -m packages.kernel --mode preflight --output .run/EXP-0002B-preflight.json
      - name: EXP-0002B TRAIN-only snapshot (no DEV/FINAL search)
        run: python -m packages.kernel --mode train --output .run/EXP-0002B-train-only.json
      # OPPORTUNITY-001 scientific boundary: NEVER execute inherited EXP-0002B
      # DEV/FINAL on PR OR main pushes. Previous main-only DEV smoke was a
      # historical workflow regression; retain its archived past provenance but
      # do not regenerate it. All tests below remain TRAIN/synthetic/hash only.
      - name: Upload EXP-0002B TRAIN-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002B-train-only
          path: |
            .run/EXP-0002B-preflight.json
            .run/EXP-0002B-train-only.json
          if-no-files-found: warn
      - name: Upload EXP-0002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002-result
          path: .run/EXP-0002-result.json
          if-no-files-found: warn
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0001-result
          path: .run/EXP-0001-result.json
          if-no-files-found: warn
