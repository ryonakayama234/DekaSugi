name: Documentation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository documents
        run: python scripts/check_docs.py
      - name: Check documentation validation tests
        run: python -m unittest discover -s tests -p "test_docs_*.py"
