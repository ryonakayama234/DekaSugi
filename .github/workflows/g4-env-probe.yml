name: G4 environment capability probe (synthetic only)
on:
  push:
    branches: [probe/g4-env-20261106]
jobs:
  cgroup-and-supervisor:
    if: github.ref == 'refs/heads/probe/g4-env-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen production sources and auditor probe files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4e8a0c2d68ba431a8446720b314fd205babe2ac3 HEAD
          git diff --quiet 4e8a0c2d68ba431a8446720b314fd205babe2ac3 HEAD -- packages/
          git diff --quiet 25e01e12b723c51d65e4bc3a0209f0a88d0b22e5 HEAD -- probe/g4-env/
      - name: Run G4 environment diagnostics v2
        shell: bash
        run: bash probe/g4-env/diag.sh
      - name: Archive unjudged environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-environment-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diag-report.txt
            probe-result-runner.json
            probe-result-root.json
            probe-result-systemd.json
          if-no-files-found: warn
          retention-days: 30
  git-push-capability:
    if: github.ref == 'refs/heads/probe/g4-env-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged production sources and probe
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4e8a0c2d68ba431a8446720b314fd205babe2ac3 HEAD
          git diff --quiet 4e8a0c2d68ba431a8446720b314fd205babe2ac3 HEAD -- packages/
          git diff --quiet 72f6020fbc299417a4b676c91f777f12186b2937 HEAD -- probe/g4-env/probe.py
      - name: Prove GitHub push and clean up isolated temporary ref
        shell: bash
        run: |
          set -uo pipefail
          ref="refs/heads/probe/g4-env-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pushed=false
          deleted=false
          if git push origin "HEAD:$ref" > git-push.log 2>&1; then
            pushed=true
            if git push origin ":$ref" >> git-push.log 2>&1; then
              deleted=true
            fi
          fi
          cat > git-push-result.json <<EOF
          {
            "credential_kind": "GITHUB_TOKEN",
            "temporary_ref": "$ref",
            "push_succeeded": $pushed,
            "cleanup_succeeded": $deleted,
            "source_commit": "$GITHUB_SHA"
          }
          EOF
          cat git-push.log
          cat git-push-result.json
          [[ "$pushed" == true && "$deleted" == true ]]
      - name: Archive GitHub push capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-git-push-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            git-push.log
            git-push-result.json
          if-no-files-found: warn
          retention-days: 30
