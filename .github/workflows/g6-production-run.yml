name: g6-production-run
on:
  push:
    branches: [audit/r2ma/g6-run-20261107]
concurrency:
  group: r2ma-g6-run-single
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Probe for auditor driver script
        run: |
          if [ -f probe/g6-production/run_production.py ]; then
            echo "ready=true" >> "$GITHUB_ENV"
          else
            echo "ready=false" >> "$GITHUB_ENV"
          fi
      - name: Run production driver as root
        if: env.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: r2ma-g6-runner
          GIT_AUTHOR_EMAIL: r2ma-g6-runner@localhost
          GIT_COMMITTER_NAME: r2ma-g6-runner
          GIT_COMMITTER_EMAIL: r2ma-g6-runner@localhost
        run: sudo --preserve-env=GITHUB_TOKEN,GIT_AUTHOR_NAME,GIT_AUTHOR_EMAIL,GIT_COMMITTER_NAME,GIT_COMMITTER_EMAIL python3 probe/g6-production/run_production.py
      - name: Stage artifacts for upload
        if: always() && env.ready == 'true'
        run: |
          sudo cp -r audit/r2ma/g6/artifacts /tmp/prod-artifacts
          sudo chmod -R a+rX /tmp/prod-artifacts
      - name: Upload production artifacts
        if: always() && env.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g6-production-run-${{ github.run_id }}
          path: /tmp/prod-artifacts/
          retention-days: 90
          if-no-files-found: warn
