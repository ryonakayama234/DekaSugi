name: rep004-disclosed-synthetic
on:
  pull_request:
    paths:
      - 'packages/rep004/**'
      - 'tests/test_rep004_engineering.py'
      - 'scripts/read_rep004_archive.py'
      - 'experiments/EXP-REP-004/**'
      - 'experiments/EXP-REP-004R/**'
      - 'scripts/run_rep004r.py'
      - '.github/workflows/rep004-disclosed-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disclosed-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public-only learner and canonical Snapshot mechanics
        run: python -m unittest tests.test_rep004_engineering -v
      - name: Verify every archived synthetic score row, hash and average
        run: |
          python scripts/read_rep004_archive.py \
            --archive experiments/EXP-REP-004/artifacts/20261102-disclosed-1920-raw.json.zlib.b64 \
            --output /tmp/rep004-recovered.json
      - name: Validate documentation index and links
        run: python scripts/check_docs.py

      - name: EXP-REP-004R corrected six-exposure disclosed synthetic research
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'exp/rep004r-remediation-train-use-score-v1' }}
        env:
          REP004R_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m scripts.run_rep004r --output-dir /tmp/rep004r-evidence --source-sha "$REP004R_SOURCE_HEAD"
      - name: Publish immutable EXP-REP-004R synthetic evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'exp/rep004r-remediation-train-use-score-v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: rep004r-corrected-disclosed-evidence
          path: /tmp/rep004r-evidence/
          if-no-files-found: warn
          retention-days: 90
