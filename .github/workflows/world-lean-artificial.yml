name: WORLD-LEAN-1 artificial fixture only
on:
  pull_request:
  workflow_dispatch:
jobs:
  world-lean-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Check pinned public/evaluator source digest
        run: python scripts/verify_world_lean_freeze.py
      - name: Run allowlisted artificial-only unit tests
        run: python -m unittest tests.test_world_lean_fixture -v
      - name: Run artificial-only engineering gate
        run: python -m world_lean_evaluator fixture-gate --output /tmp/world-lean-artificial-evidence.json
      - name: Show formal protocol refuses without Owner approval
        run: python -c 'from world_lean_evaluator.protocol import formal_run,OwnerEvaluationAuthorizationRequired; import sys; exec("try:\n formal_run()\nexcept OwnerEvaluationAuthorizationRequired:\n sys.exit(0)\nsys.exit(1)")'
